<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本地数据迁移 · 家庭存钱计划</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --text:#1f2937; --muted:#6b7280;
    --primary:#ff6b6b; --ok:#16a34a; --line:#eef0f3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);padding:20px;}
  .wrap{max-width:560px;margin:0 auto;}
  .card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.06);}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .stat{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:18px;text-align:center;}
  .stat .num{font-size:34px;font-weight:700;color:var(--primary)}
  .stat .lbl{font-size:13px;color:var(--muted)}
  button{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;
    background:var(--primary);color:#fff;cursor:pointer;transition:.15s;}
  button:disabled{background:#f0b9b9;cursor:not-allowed}
  .msg{margin-top:16px;font-size:14px;line-height:1.6;background:var(--bg);border-radius:10px;padding:12px;white-space:pre-wrap;}
  .ok{color:var(--ok);font-weight:600}
  .err{color:var(--primary);font-weight:600}
  a.back{display:inline-block;margin-top:16px;color:var(--primary);text-decoration:none;font-size:14px;}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📦 本地数据迁移到云端</h1>
    <div class="sub">把之前存在你浏览器里的旧数据，写入 Supabase 云端（跨设备同步）。</div>

    <div class="stat">
      <div class="num" id="count">0</div>
      <div class="lbl">条本地旧数据待迁移</div>
    </div>

    <button id="btn" disabled>导入到云端</button>

    <div class="msg hidden" id="msg"></div>

    <a class="back hidden" id="back" href="./index.html">→ 返回主页查看数据</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://cbnbbrrfbolwvuejoqmk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pbzgGVvgjaSovXpCmp8-qw_AlafRvF6';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const OLD_KEY = 'family_savings_records_v1';

const countEl = document.getElementById('count');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
const back = document.getElementById('back');

function setMsg(text, cls){
  msg.className = 'msg' + (cls ? ' ' + cls : '');
  msg.textContent = text;
  msg.classList.remove('hidden');
}

// 读取本地旧数据
let oldRecords = [];
try {
  oldRecords = JSON.parse(localStorage.getItem(OLD_KEY)) || [];
  if (!Array.isArray(oldRecords)) oldRecords = [];
} catch(e) { oldRecords = []; }

countEl.textContent = oldRecords.length;
if (oldRecords.length > 0) {
  btn.disabled = false;
  setMsg('已检测到 ' + oldRecords.length + ' 条本地旧数据，点击按钮即可写入云端。', '');
} else {
  setMsg('未发现本地旧数据。\n（旧数据只在你之前填过的那台设备/浏览器里；换设备打开则读不到，属正常。）', '');
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  btn.textContent = '导入中…';
  setMsg('开始导入，请稍候…', '');
  let ok = 0, fail = 0;
  for (const r of oldRecords) {
    const payload = {
      date:   String(r.date || '').trim(),
      amount: Number(r.amount) || 0,
      method: String(r.method || '存入').trim(),
      source: String(r.source || '家庭').trim(),
      note:   String(r.note || '').trim()
    };
    const { error } = await supabase.from('savings_records').insert(payload);
    if (error) { fail++; console.error(error); break; }
    ok++;
  }
  if (fail === 0) {
    localStorage.removeItem(OLD_KEY);   // 迁移成功，清空本地，避免重复导入
    setMsg('✅ 成功导入 ' + ok + ' 条数据到云端！\n本地旧数据已清空，现在打开主页就能看到，且各设备自动同步。', 'ok');
    back.classList.remove('hidden');
    btn.textContent = '已完成';
  } else {
    setMsg('⚠️ 导入中断：成功 ' + ok + ' 条，失败 ' + fail + ' 条。\n请检查网络后重试（未导入的仍保留在本地）。', 'err');
    btn.disabled = false;
    btn.textContent = '重试导入';
  }
});
</script>
</body>
</html>
